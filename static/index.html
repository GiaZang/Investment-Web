<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinLens · 财报透镜</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e4e7ec; --ink:#15181e; --sub:#6b7280;
    --blue:#2563eb; --up:#c73b32; --down:#0a7a3d; --warn:#9a6a00; --warnbg:#fff6e0;
    --red:#b02a20; --redbg:#fdecec; --grey:#4b5563; --greybg:#eef1f5;
  }
  body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);
       color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:288px 1fr;min-height:100vh}

  /* ---------- 侧边栏 ---------- */
  aside{background:#131720;color:#c9d1d9;padding:20px 16px;display:flex;flex-direction:column;gap:18px}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:2px}
  .brand i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
           display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:13px}
  .brand b{color:#fff;font-size:15px;letter-spacing:.3px}
  .brand span{display:block;color:#6e7785;font-size:11px;font-weight:400;letter-spacing:.4px}
  .side-h{font-size:11px;color:#6e7785;letter-spacing:1px;margin-bottom:6px}
  aside label{display:block;font-size:12px;color:#9aa4b1;margin:8px 0 4px}
  aside select,aside input{width:100%;padding:7px 9px;border-radius:7px;border:1px solid #2b3240;
       background:#1b2029;color:#e6edf3;font-size:13px;font-family:inherit}
  aside input[type=file]{padding:6px;font-size:11px;color:#9aa4b1}
  aside select:focus,aside input:focus{outline:1px solid #3b82f6;border-color:#3b82f6}
  .hint{font-size:11px;color:#6e7785;line-height:1.55;margin-top:6px}
  .hint.warn{color:#d6a03a}
  aside .grow{flex:1}
  .side-foot{font-size:11px;color:#5c6672;border-top:1px solid #232a36;padding-top:10px;line-height:1.6}

  /* ---------- 主区 ---------- */
  main{padding:22px 28px 60px;max-width:1240px}
  .head h1{font-size:20px;font-weight:650;letter-spacing:-.2px}
  .head p{color:var(--sub);font-size:12.5px;margin-top:3px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
  .chip{background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:11.5px;color:var(--grey)}
  .chip b{color:var(--ink);font-weight:600}
  .chip a{color:var(--blue);text-decoration:none}
  .chip a:hover{text-decoration:underline}

  .banner{border-radius:9px;padding:10px 13px;margin-top:12px;font-size:12.5px;line-height:1.6;display:none}
  .banner.show{display:block}
  .banner.err{background:var(--redbg);border:1px solid #f3c9c5;color:var(--red)}
  .banner.warn{background:var(--warnbg);border:1px solid #f0dcae;color:var(--warn)}
  .banner.ok{background:#eaf5ee;border:1px solid #cbe6d5;color:#0a7a3d}

  .tabs{display:flex;gap:2px;margin:18px 0 0;border-bottom:1px solid var(--line)}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;
       font-size:13.5px;color:var(--sub);cursor:pointer;font-family:inherit}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

  .pane{display:none;padding-top:16px}
  .pane.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .card-t{font-size:13px;font-weight:600;margin-bottom:2px}
  .card-s{font-size:11.5px;color:var(--sub)}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;border-left:3px solid var(--blue)}
  .kpi .k{font-size:11.5px;color:var(--sub)}
  .kpi .v{font-size:17px;font-weight:650;letter-spacing:-.3px;margin-top:2px}
  .kpi .d{font-size:11.5px;margin-top:1px}
  .kpi .d.up{color:var(--up)} .kpi .d.down{color:var(--down)} .kpi .d.flat{color:var(--sub)}

  /* 结论条目 */
  .claim{border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:8px;overflow:hidden}
  .claim-h{display:flex;gap:9px;align-items:flex-start;padding:11px 13px}
  .claim-h .txt{flex:1;font-size:13.5px;line-height:1.62}
  .claim-h .txt .caveat{display:block;font-size:11.5px;color:var(--warn);margin-top:4px}
  .badge{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:600;white-space:nowrap}
  .b-hi{background:#e7f7ed;color:#0a7a3d} .b-mid{background:var(--warnbg);color:var(--warn)}
  .b-low{background:var(--greybg);color:var(--grey)}
  .b-hit{background:var(--redbg);color:var(--red)} .b-ok{background:var(--greybg);color:var(--grey)}
  .b-nan{background:var(--warnbg);color:var(--warn)} .b-note{background:#eef4ff;color:#1d4ed8}
  .toggle{background:none;border:1px solid var(--line);border-radius:6px;color:var(--sub);
       font-size:11.5px;padding:2px 8px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .toggle:hover{border-color:var(--blue);color:var(--blue)}
  .ev{display:none;border-top:1px dashed var(--line);padding:10px 13px;background:#fafbfc}
  .ev.on{display:block}
  .ev .row{font-size:11.5px;color:var(--sub);margin-bottom:6px}
  .ev .row b{color:var(--ink);font-weight:600}
  .ev pre{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#3f4652;
       background:#f2f4f7;border-radius:7px;padding:8px 10px;white-space:pre-wrap;word-break:break-all}
  .ev a{color:var(--blue);text-decoration:none} .ev a:hover{text-decoration:underline}

  /* 归因 */
  .bars{margin-top:6px}
  .bar-row{display:grid;grid-template-columns:150px 1fr 96px;gap:10px;align-items:center;
       padding:7px 0;border-bottom:1px dashed #eef0f3;font-size:12.5px}
  .bar-row:last-child{border-bottom:none}
  .bar-row .f{color:var(--ink)}
  .bar-row .track{background:#f1f3f6;border-radius:5px;height:16px;position:relative;overflow:hidden}
  .bar-row .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:5px}
  .bar-row .fill.neg{background:linear-gradient(90deg,#f0a3a3,#c73b32)}
  .bar-row .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--grey)}
  .bar-row.uncovered .track{background:repeating-linear-gradient(45deg,#f6f7f9,#f6f7f9 5px,#eceff3 5px,#eceff3 10px)}
  .bar-row.uncovered .p{color:var(--warn);font-size:11.5px}
  .note-line{margin-top:10px;font-size:12px;color:var(--grey);background:#fafbfc;border:1px solid var(--line);
       border-radius:8px;padding:9px 11px}
  .note-line b{color:var(--ink)}

  /* 雷达 */
  .radar-row{border:1px solid var(--line);border-radius:9px;background:#fff;padding:11px 13px;margin-bottom:8px}
  .radar-h{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .radar-h .nm{font-size:13.5px;font-weight:600;margin-right:2px}
  .radar-h .obs{width:100%;font-size:12px;color:var(--grey);margin-top:5px;font-variant-numeric:tabular-nums}
  .radar-h .th{font-size:11.5px;color:var(--sub);width:100%;margin-top:1px}
  .explain{margin-top:7px;font-size:12px;color:#3f4652;background:#f7f9fb;border-left:3px solid #a9c3e8;
       border-radius:0 7px 7px 0;padding:7px 10px}
  .explain b{font-weight:600}
  .rnote{margin-top:6px;font-size:11.5px;color:var(--warn)}

  /* 问答 */
  .qa-bar{display:flex;gap:8px;margin-bottom:10px}
  .qa-bar input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit}
  .qa-bar input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #dbeafe}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;
       cursor:pointer;font-family:inherit;font-weight:500}
  .btn:hover{background:#1d4ed8} .btn:disabled{background:#9fb4d8;cursor:default}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--grey)}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue);background:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chips button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 11px;
       font-size:11.5px;color:var(--grey);cursor:pointer;font-family:inherit}
  .chips button:hover{border-color:var(--blue);color:var(--blue)}
  .ans{font-size:13.5px;line-height:1.75}
  .cite{font-size:11.5px;color:var(--grey);border-top:1px dashed var(--line);margin-top:9px;padding-top:8px}
  .cite div{margin-bottom:4px;word-break:break-all}
  .cite b{color:var(--blue);font-weight:600}
  .empty{color:var(--sub);font-size:12.5px;padding:22px 0;text-align:center}

  .foot{margin-top:22px;font-size:11.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;line-height:1.7}
  .loading{opacity:.45;pointer-events:none;transition:opacity .15s}
  @media (max-width:900px){
    .app{grid-template-columns:1fr} aside{flex-direction:row;flex-wrap:wrap}
    aside>div{flex:1 1 200px} main{padding:16px}
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <i>F</i>
      <div><b>FinLens</b><span>财报透镜 · 3 分钟速读</span></div>
    </div>

    <div>
      <div class="side-h">数据源</div>
      <label for="co">公司</label>
      <select id="co"></select>
      <label for="asof">稿件日期（决定可用信息边界）</label>
      <input id="asof" type="date" value="2026-11-05">
      <div class="hint" id="srcHint">数字来自巨潮资讯三季报原文，可点「查看原文」回链核对。</div>
    </div>

    <div>
      <div class="side-h">上传财报（可选）</div>
      <input id="pdf" type="file" accept=".pdf">
      <div class="hint" id="pdfHint">上传后会用文件里的科目替换同名项，未能抽取的科目沿用样例。</div>
    </div>

    <div>
      <div class="side-h">大模型（可选）</div>
      <label for="key">API Key</label>
      <input id="key" type="password" placeholder="留空则只用本地规则" autocomplete="off">
      <label for="base">Base URL</label>
      <input id="base" type="text" value="https://api.deepseek.com">
      <label for="model">模型</label>
      <input id="model" type="text" value="deepseek-chat">
      <div class="hint">Key 只随本次请求转发，服务端不保存、不落盘。</div>
    </div>

    <div class="grow"></div>
    <div class="side-foot">
      不预测涨跌、不给买卖建议、不判定财务造假。<br>所有结论可回原文核对。
    </div>
  </aside>

  <main id="app">
    <div class="head">
      <h1 id="title">财报速读</h1>
      <p id="subtitle">正在加载…</p>
    </div>
    <div class="meta" id="meta"></div>
    <div class="banner" id="banner"></div>
    <div class="banner" id="banner2"></div>

    <nav class="tabs">
      <button data-tab="summary" class="on">一键摘要</button>
      <button data-tab="attr">利润归因</button>
      <button data-tab="radar">风险雷达</button>
      <button data-tab="qa">智能问答</button>
    </nav>

    <section class="pane on" id="p-summary"></section>
    <section class="pane" id="p-attr"></section>
    <section class="pane" id="p-radar"></section>
    <section class="pane" id="p-qa"></section>

    <div class="foot" id="foot"></div>
  </main>
</div>

<script>
/* 直接双击 index.html（file:// 协议）时，浏览器不允许页面请求后端接口，
   页面必然是空的。这里先把正确用法讲清楚，避免被误判成"页面坏了"。 */
if (location.protocol === 'file:') {
  document.title = 'FinLens · 需要通过服务访问';
  document.body.innerHTML = `
  <div style="max-width:660px;margin:11vh auto;padding:0 24px;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#15181e">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span style="width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:700">F</span>
      <b style="font-size:17px">FinLens 财报透镜</b>
    </div>
    <div style="background:#fff;border-radius:14px;padding:28px 30px;box-shadow:0 8px 32px rgba(0,0,0,.06)">
      <h1 style="font-size:18px;margin:0 0 12px">这个页面需要通过服务访问，不能直接双击打开</h1>
      <p style="color:#4b5563;margin:0 0 16px">
        你现在打开的是本地文件（<code>file://</code>）。页面本身只是一层前端，营业收入、结论、风险雷达这些数据都要向后端接口请求，
        而浏览器不允许本地文件请求接口，所以这里只会显示空白。
      </p>
      <p style="margin:0 0 8px;font-weight:600">两种正确打开方式：</p>
      <ol style="color:#4b5563;margin:0 0 6px;padding-left:22px;line-height:1.9">
        <li>在 <code>FinLens/</code> 目录执行 <code style="background:#f1f3f7;padding:2px 6px;border-radius:4px">python app.py</code>，
            然后浏览器打开 <a href="http://127.0.0.1:8000">http://127.0.0.1:8000</a></li>
        <li>或直接使用线上版本：
            <a href="https://claimguard.app.workbuddy.host/?sharecode=3FNZEF5AVT">claimguard.app.workbuddy.host/?sharecode=3FNZEF5AVT</a></li>
      </ol>
      <p style="color:#6b7280;font-size:12px;margin:14px 0 0">线上版本的地址必须带 <code>?sharecode=3FNZEF5AVT</code>，只写域名会被网关拦下。</p>
    </div>
  </div>`;
  throw new Error('FinLens 需要通过 HTTP 服务访问（file:// 无法请求接口）');
}
</script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = { data: null, tab: 'summary', qa: null, loading: false };

function banner(msg, kind = 'err') {
  const b = $('#banner');
  if (!msg) { b.className = 'banner'; b.textContent = ''; return; }
  b.className = 'banner show ' + kind;
  b.textContent = msg;
}
/* 第二条提示：上传成功与"科目缺失/口径混用"必须同时可见，不能互相覆盖 */
function banner2(msg, kind = 'warn') {
  const b = $('#banner2');
  if (!msg) { b.className = 'banner'; b.textContent = ''; return; }
  b.className = 'banner show ' + kind;
  b.textContent = msg;
}
function busy(on) {
  S.loading = on;
  $('#app').classList.toggle('loading', on);
}

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch (_) {}
  if (!res.ok) {
    const e = (body && body.error) || {};
    throw new Error(e.message || `请求失败（HTTP ${res.status}）`);
  }
  return body;
}

/* ---------- 侧边栏 ---------- */
async function initSide() {
  const h = await api('/api/health');
  const c = await api('/api/companies');
  $('#co').innerHTML = c.companies.map((x) =>
    `<option value="${x.code}">${esc(x.name)} ${x.code}　·　${x.metrics} 项指标</option>`).join('');
  if (!h.pdf_upload) {
    $('#pdf').disabled = true;
    $('#pdfHint').innerHTML = '<span style="color:#d6a03a">当前部署未启用 PDF 解析（缺 pypdf），已使用内置样例；本地 `pip install pypdf` 后即可上传。</span>';
  }
  return h;
}

function cfgBody() {
  return {
    api_key: $('#key').value.trim(),
    base_url: $('#base').value.trim(),
    model: $('#model').value.trim(),
  };
}

/* 上传后的指标要随问答/改写一起回传，否则后端会退回内置快照，答案与页面数字不一致 */
function uploadBody() {
  if (!S.data || S.data.meta.source !== 'uploaded') return {};
  const up = {};
  Object.entries(S.data.metrics).forEach(([k, m]) => {
    if (m.source === 'uploaded') {
      up[k] = { label: m.label, value: m.value, prev: m.prev, yoy: m.yoy, quote: m.quote, offset: m.offset };
    }
  });
  return { upload_metrics: up };
}

/* ---------- 加载与渲染 ---------- */
async function load() {
  busy(true); banner(''); banner2('');
  try {
    const q = new URLSearchParams({ code: $('#co').value, as_of: $('#asof').value });
    S.data = await api('/api/analyze?' + q);
    S.qa = null;
    renderAll();
  } catch (e) {
    S.data = null;
    banner('⚠ ' + e.message + '（未生成任何结论，避免在信息不足时给出"正常"判断）');
    renderEmpty();
  } finally { busy(false); }
}

function renderEmpty() {
  $('#title').textContent = '财报速读';
  $('#subtitle').textContent = '当前没有可分析的数据';
  $('#meta').innerHTML = '';
  ['#p-summary', '#p-attr', '#p-radar', '#p-qa'].forEach((s) => $(s).innerHTML = '<div class="empty">—</div>');
  $('#foot').textContent = '';
}

function renderAll() {
  const d = S.data, m = d.meta;
  $('#title').textContent = `${m.name}（${m.code}）`;
  $('#subtitle').textContent = `${m.period} · ${m.doc_title} · 单位：人民币元（除注明外）`;
  const pdfChip = m.pdf_url
    ? `<span class="chip"><a href="${esc(m.pdf_url)}" target="_blank" rel="noreferrer">查看原文 PDF ↗</a></span>`
    : `<span class="chip">来源 <b>上传文件</b>（无外部链接）</span>`;
  $('#meta').innerHTML = [
    `<span class="chip">披露日 <b>${esc(m.published_at)}</b></span>`,
    `<span class="chip">稿件日期 <b>${esc(m.as_of)}</b></span>`,
    `<span class="chip">口径 <b>${m.source === 'uploaded' ? '上传文件' : '定期报告原文'}</b></span>`,
    `<span class="chip">指标覆盖 <b>${m.coverage.ratio}%</b>（${m.coverage.present.length}/7）</span>`,
    pdfChip,
  ].join('');

  /* 多个告警必须同时可见：科目缺失 / 口径混用 / 主体未验证 / 披露日未知 */
  const warns = [];
  if (m.coverage.missing.length) {
    warns.push(`以下科目未取得，相关规则显示「无法判断」而非「未见异常」：${m.coverage.missing.join('、')}`);
  }
  if (m.mixed) {
    warns.push(`有 ${m.carried_over.length} 项科目未从文件中抽取到，仍沿用内置快照，口径可能不一致`);
  }
  if (m.subject_unverified) {
    warns.push('未能从文件中识别公司主体，请自行确认上传的是当前所选公司的财报');
  }
  if (m.disclosure_unknown) {
    warns.push('上传文件的真实披露日无法可靠取得，已按稿件日期处理并标注为未知');
  }
  banner2(warns.join('　｜　'), 'warn');

  renderSummary(); renderAttr(); renderRadar(); renderQA();
  $('#foot').textContent = d.disclaimer;
}

const CONF = { '高': 'b-hi', '中': 'b-mid', '低': 'b-low' };
const CONF_NOTE = { '高': '按「已披露原文」直接核', '中': '口径双因子影响，需结合上下文', '低': '非可直接核对项' };

function claimHtml(c) {
  const ev = c.evidence;
  const loc = ev.page ? `第 ${esc(ev.page)} 页 · ` : '';
  const link = ev.url
    ? `<div class="row" style="margin-top:6px"><a href="${esc(ev.url)}" target="_blank" rel="noreferrer">打开原文 PDF 核对 ↗</a></div>`
    : `<div class="row" style="margin-top:6px">上传件无外部链接：请用下面的原文片段在原文件中检索核对</div>`;
  return `<div class="claim">
    <div class="claim-h">
      <span class="badge ${CONF[c.confidence] || 'b-low'}" title="${esc(CONF_NOTE[c.confidence] || '')}">置信度 ${esc(c.confidence)}</span>
      <div class="txt">${esc(c.text)}
        ${c.caveat ? `<span class="caveat">口径提示：${esc(c.caveat)}</span>` : ''}</div>
      <button class="toggle" data-ev="${esc(c.id)}">查看原文</button>
    </div>
    <div class="ev" id="ev-${esc(c.id)}">
      <div class="row">出处　<b>${esc(ev.doc)}</b>　·　${loc}${esc(ev.offset_kind || '页内字符偏移')} ${esc(ev.offset)}　·　披露 ${esc(ev.published_at)}　·　来源 <b>${ev.source === 'uploaded' ? '上传文件' : '定期报告'}</b></div>
      <pre>${esc(ev.quote)}</pre>
      ${link}
    </div>
  </div>`;
}

function kpi(label, key) {
  const m = S.data.metrics[key];
  if (!m) return `<div class="kpi"><div class="k">${label}</div><div class="v">—</div><div class="d flat">未取得</div></div>`;
  let pctText = '—', cls = 'flat';
  if (m.yoy != null) { pctText = `同比 ${m.yoy > 0 ? '+' : ''}${m.yoy.toFixed(2)}%`; cls = m.yoy > 0 ? 'up' : (m.yoy < 0 ? 'down' : 'flat'); }
  else if (m.prev) {
    const g = (m.value / m.prev - 1) * 100;
    pctText = `较上年末 ${g > 0 ? '+' : ''}${g.toFixed(2)}%`; cls = g > 0 ? 'up' : (g < 0 ? 'down' : 'flat');
  }
  return `<div class="kpi"><div class="k">${label}</div><div class="v">${esc(m.display.value)}</div>
    <div class="d ${cls}">${pctText}</div></div>`;
}

function renderSummary() {
  const d = S.data;
  $('#p-summary').innerHTML = `
    <div class="kpis">
      ${kpi('营业收入', 'revenue')}${kpi('归母净利润', 'np_parent')}${kpi('扣非净利润', 'np_deduct')}
      ${kpi('经营活动现金流净额', 'ocf')}${kpi('存货', 'inventory')}${kpi('应收账款', 'ar')}
    </div>
    <div class="card">
      <div class="card-t">逐条结论　<span class="card-s">共 ${d.claims.length} 条，每条都可回原文；无引文的条目不会出现在这里</span></div>
    </div>
    ${d.claims.length ? d.claims.map(claimHtml).join('') : '<div class="empty">该报告未抽取到可核对指标，未生成结论。</div>'}    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost" id="btnPolish">用 AI 改写摘要（数字不变）</button>
      <button class="btn ghost" id="btnExport">导出核查底稿 .md</button>
      <span class="card-s" style="align-self:center">改写结果需通过「数字白名单 + 合规词表」双重校验</span>
    </div>
    <div id="polishBox"></div>`;
  document.querySelectorAll('[data-ev]').forEach((b) => {
    b.onclick = () => {
      const el = $('#ev-' + b.dataset.ev);
      el.classList.toggle('on');
      b.textContent = el.classList.contains('on') ? '收起' : '查看原文';
    };
  });
  $('#btnExport').onclick = exportReport;
  $('#btnPolish').onclick = polish;
}

async function exportReport() {
  try {
    const q = new URLSearchParams({ code: S.data.meta.code, as_of: S.data.meta.as_of });
    const res = await fetch('/api/report?' + q);
    const text = await res.text();
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = JSON.parse(text).error.message || msg; } catch (_) {}
      throw new Error(msg);
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
    a.download = `FinLens_${S.data.meta.code}_${S.data.meta.published_at}.md`;
    a.click(); URL.revokeObjectURL(a.href);
  } catch (e) { banner('导出失败：' + e.message, 'err'); }
}

async function polish() {
  const box = $('#polishBox');
  const text = S.data.claims.slice(0, 4).map((c) => c.text).join('；');
  box.innerHTML = '<div class="card"><div class="card-s">改写中…</div></div>';
  try {
    const r = await api('/api/polish', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: S.data.meta.code, as_of: S.data.meta.as_of, text, ...cfgBody(), ...uploadBody() }),
    });
    const label = { TEMPLATE: '模板（未调用模型）', LLM: '大模型改写｜已通过校验', REJECTED: '已拒绝采用 AI 输出', REWRITTEN: '已按合规规则改写' }[r.mode] || r.mode;
    box.innerHTML = `<div class="card"><div class="card-t">${esc(label)}</div>
      <div class="ans" style="margin-top:6px">${esc(r.text)}</div>
      ${r.warn ? `<div class="rnote">⚠ ${esc(r.warn)}</div>` : ''}</div>`;
    if (r.warn) banner(r.warn, r.mode === 'TEMPLATE' ? 'warn' : 'warn');
  } catch (e) {
    box.innerHTML = `<div class="card"><div class="card-s">改写失败：${esc(e.message)}</div></div>`;
  }
}

function renderAttr() {
  const a = S.data.attribution;
  if (!a.ok) {
    $('#p-attr').innerHTML = `<div class="card">
      <div class="card-t">无法计算归因</div>
      <div class="card-s" style="margin-top:6px">${esc(a.reason || '缺少两期原值')}</div>
      <div class="note-line" style="margin-top:10px">处置原则：<b>算不出来就不给结论</b>。不用「本期÷(1+同比)」反推基期——实测该做法会引入数万元级误差，看起来专业但数字是错的。</div>
    </div>`;
    return;
  }
  const maxAbs = Math.max(10, ...a.contributors.filter((c) => c.contribution_pct != null)
    .map((c) => Math.abs(c.contribution_pct)));
  const rows = a.contributors.map((c) => {
    if (c.contribution_pct == null) {
      return `<div class="bar-row uncovered"><div class="f">${esc(c.factor)}</div>
        <div class="track"></div><div class="p">未覆盖</div></div>`;
    }
    const w = Math.min(100, Math.abs(c.contribution_pct) / maxAbs * 100);
    return `<div class="bar-row"><div class="f">${esc(c.factor)}</div>
      <div class="track"><div class="fill ${c.contribution_pct < 0 ? 'neg' : ''}" style="width:${w}%"></div></div>
      <div class="p">${c.contribution_pct > 0 ? '+' : ''}${c.contribution_pct.toFixed(1)}%</div></div>`;
  }).join('');
  const rest = 100 - a.covered_ratio;
  $('#p-attr').innerHTML = `
    <div class="card">
      <div class="card-t">增速差被什么解释了</div>
      <div class="card-s">营收 ${a.revenue_growth > 0 ? '+' : ''}${a.revenue_growth.toFixed(2)}%　·　归母 ${a.profit_growth > 0 ? '+' : ''}${a.profit_growth.toFixed(2)}%　·　增速差 <b style="color:#15181e">${a.gap > 0 ? '+' : ''}${a.gap.toFixed(2)}pct</b>　·　利润增量 ${(a.profit_increment / 1e8).toFixed(2)} 亿元</div>
    </div>
    <div class="card">
      <div class="card-t">贡献拆解</div>
      <div class="bars">${rows}</div>
      <div class="note-line">已解释 <b>${a.covered_ratio.toFixed(1)}%</b>，未解释 <b>${rest.toFixed(1)}%</b>。
        ${rest > 1 ? '剩余部分主要来自毛利率（未建事实卡）与未覆盖因子，明确列为未覆盖，不补一句"受益于产品结构优化"这类听起来对、却无出处的解释。' : ''}
        ${a.clamped ? `<br>注：各因子合计为 ${a.raw_covered_ratio.toFixed(1)}%，超出增速差可解释范围，已按 0–100% 截断；单因子近似拆分在利润增量较小时不稳定。` : ''}
      </div>
      ${a.contributors.filter((c) => c.basis === 'computed').map((c) => `<div class="rnote" style="color:#6b7280">${esc(c.factor)}：${esc(c.detail)}</div>`).join('')}
    </div>`;
}

const RSTATUS = {
  HIT: ['b-hit', '命中 · 需人工复核'], NOT_HIT: ['b-ok', '未见异常'],
  INSUFFICIENT: ['b-nan', '无法判断'], NOTED: ['b-note', '提示 · 已降级'],
};

function renderRadar() {
  const rows = S.data.radar;
  const n = (s) => rows.filter((r) => r.status === s).length;
  $('#p-radar').innerHTML = `
    <div class="card">
      <div class="card-t">命中 ${n('HIT')} 项 · 提示 ${n('NOTED')} 项 · 未见异常 ${n('NOT_HIT')} 项 · 无法判断 ${n('INSUFFICIENT')} 项</div>
      <div class="card-s">只输出信号与「需人工复核」，不给风险等级、不打分、不下结论；命中项并列公司自述原因。</div>
    </div>
    ${rows.map((r) => {
      const [cls, label] = RSTATUS[r.status] || ['b-low', r.status];
      return `<div class="radar-row">
        <div class="radar-h">
          <span class="badge b-low">${esc(r.id)}</span>
          <span class="nm">${esc(r.name)}</span>
          <span class="badge ${cls}">${label}</span>
          <span class="obs">观测值：${esc(r.observed)}</span>
          <span class="th">${esc(r.formula)} ${esc(r.threshold)}</span>
        </div>
        ${r.explain ? `<div class="explain"><b>公司自述原因：</b>${esc(r.explain)}</div>` : ''}
        ${r.note ? `<div class="rnote">规则提示：${esc(r.note)}</div>` : ''}
        ${r.evidence ? `<div style="margin-top:7px"><button class="toggle" data-rev="${esc(r.id)}">查看原文</button>
          <div class="ev" id="rev-${esc(r.id)}" style="border:none;background:none;padding:8px 0 0">
            <div class="row">出处　<b>${esc(r.evidence.doc)}</b> · ${r.evidence.page ? `第 ${esc(r.evidence.page)} 页 · ` : ''}${esc(r.evidence.offset_kind || '页内字符偏移')} ${esc(r.evidence.offset)}</div>
            <pre>${esc(r.evidence.quote)}</pre></div></div>` : ''}
      </div>`;
    }).join('')}`;
  document.querySelectorAll('[data-rev]').forEach((b) => {
    b.onclick = () => {
      const el = $('#rev-' + b.dataset.rev);
      el.classList.toggle('on');
      b.textContent = el.classList.contains('on') ? '收起' : '查看原文';
    };
  });
}

function renderQA() {
  const ex = ['存货为什么增加这么多', '经营现金流和净利润差多少', '研发费用率变化', '应收账款较上年末变化'];
  $('#p-qa').innerHTML = `
    <div class="qa-bar">
      <input id="q" placeholder="只回答这份财报里能核到原文的问题，例：存货为什么增加这么多">
      <button class="btn" id="ask">提问</button>
    </div>
    <div class="chips">${ex.map((e) => `<button data-ex="${esc(e)}">${esc(e)}</button>`).join('')}</div>
    <div id="answer"><div class="empty">问一个能在这份财报原文里核到的问题；答不出的会明确拒答，并给出可回答的问题建议。</div></div>`;
  $('#ask').onclick = ask;
  $('#q').onkeydown = (e) => { if (e.key === 'Enter') ask(); };
  document.querySelectorAll('[data-ex]').forEach((b) => { b.onclick = () => { $('#q').value = b.dataset.ex; ask(); }; });
  if (S.qa) paintAnswer(S.qa);
}

async function ask() {
  const q = $('#q').value.trim();
  if (!q) return;
  const box = $('#answer');
  box.innerHTML = '<div class="empty">检索原文中…</div>';
  $('#ask').disabled = true;
  try {
    const r = await api('/api/qa', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: S.data.meta.code, as_of: S.data.meta.as_of, q, ...cfgBody(), ...uploadBody() }),
    });
    S.qa = r; paintAnswer(r);
  } catch (e) {
    box.innerHTML = `<div class="banner show err">${esc(e.message)}</div>`;
  } finally { $('#ask').disabled = false; }
}

function paintAnswer(r) {
  const box = $('#answer');
  if (!r.ok) {
    box.innerHTML = `<div class="card">
      <div class="card-t">无法回答</div>
      <div class="ans" style="margin-top:5px">${esc(r.message || '未在披露文件中找到对应信息。')}</div>
      ${(r.suggestions || []).length ? `<div class="cite">可以试试：<br>${r.suggestions.map((s) => '· ' + esc(s)).join('<br>')}</div>` : ''}
    </div>`;
    return;
  }
  const mode = { STRUCTURED: '确定性计算', EXTRACTIVE: '原文摘录', LLM: '大模型 · 已过校验' }[r.mode] || r.mode;
  box.innerHTML = `<div class="card">
    <div class="card-t">${esc(mode)}<span class="card-s">　答案中的每个数字都来自右侧引文</span></div>
    <div class="ans" style="margin-top:6px">${esc(r.answer)}</div>
    ${r.warn ? `<div class="rnote">⚠ ${esc(r.warn)}</div>` : ''}
    <div class="cite">${(r.citations || []).map((c, i) => `<div><b>[${i + 1}]</b> ${esc(c.source)}：${esc(c.text.replace(/\n/g, ' · ')).slice(0, 130)}</div>`).join('')}</div>
  </div>`;
}

/* ---------- 上传 ---------- */
$('#pdf').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  busy(true); banner('');
  try {
    const q = new URLSearchParams({ code: $('#co').value, as_of: $('#asof').value });
    const res = await fetch('/api/upload?' + q, {
      method: 'POST', headers: { 'Content-Type': 'application/pdf' }, body: await file.arrayBuffer(),
    });
    const body = await res.json();
    if (!res.ok) throw new Error((body.error && body.error.message) || '解析失败');
    S.data = body; S.qa = null; renderAll();
    banner(`已解析 ${body.upload.pages} 页、抽取 ${body.upload.extracted} 项科目。${body.upload.note}`, 'ok');
  } catch (err) {
    banner('PDF 处理失败：' + err.message + ' 可继续使用内置样例，或换一份可复制文本的财报。', 'err');
  } finally { busy(false); e.target.value = ''; }
});

function switchTab(name) {
  const btn = document.querySelector(`.tabs button[data-tab="${name}"]`);
  if (!btn) return;
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach((x) => x.classList.remove('on'));
  btn.classList.add('on');
  $('#p-' + name).classList.add('on');
  S.tab = name;
  history.replaceState(null, '', '#' + name);
}

/* ---------- 启动 ---------- */
document.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => switchTab(b.dataset.tab); });
$('#co').onchange = load;
$('#asof').onchange = load;

(async () => {
  try { await initSide(); } catch (e) { banner('初始化失败：' + e.message); }
  await load();
  const t = (location.hash || '').replace('#', '');
  if (t) switchTab(t);
  const q0 = new URLSearchParams(location.search).get('q');
  if (q0) { $('#q').value = q0; switchTab('qa'); ask(); }
})();
</script>
</body>
